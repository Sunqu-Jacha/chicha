<!doctype html>
<html lang="es-PE">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chicha · Mapa de Emprendimiento</title>
  <meta name="description" content="Chicha, el mapa de emprendimiento de Sunqu Jach'a: agentes y convocatorias para el arte, la cultura y la educación en el Perú.">
  <meta name="theme-color" content="#C8232C">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="es_PE">
  <meta property="og:site_name" content="Chicha">
  <meta property="og:title" content="Chicha · Mapa de Emprendimiento">
  <meta property="og:description" content="Agentes y convocatorias para el arte, la cultura y la educación en el Perú. Una iniciativa de Sunqu Jach'a.">
  <meta property="og:image" content="assets/img/og.png">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" type="image/svg+xml" href="assets/img/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Work+Sans:wght@400;500&display=swap">
  <link rel="stylesheet" href="assets/css/tokens.css">
  <link rel="stylesheet" href="assets/css/base.css">
</head>
<body>
  <a class="saltar" href="#vista">Saltar al contenido</a>

  <header class="cabecera">
    <div class="cabecera__fila">
      <a class="logotipo" href="#/" aria-label="Chicha, por Sunqu Jach'a, ir al inicio">
        <span class="logotipo__marca">CHICHA</span>
        <span class="logotipo__sub">por Sunqu Jach'a</span>
      </a>

      <button type="button" class="btn-menu" id="btn-menu" aria-expanded="false" aria-controls="nav-principal">Menú</button>

      <nav class="nav" id="nav-principal" aria-label="Principal">
        <a href="#/explorar" data-ruta="explorar">Explorar</a>
        <a href="#/convocatorias" data-ruta="convocatorias">Convocatorias</a>
        <a href="#/internacional" data-ruta="internacional">Internacional</a>
        <a href="#/sobre" data-ruta="sobre">Sobre Chicha</a>
      </nav>

      <button type="button" class="btn btn--primario" id="btn-anadir">+ Añadir</button>
    </div>
    <div class="franja-awayo" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span></div>
  </header>

  <main id="vista" tabindex="-1">
    <p class="vista__espera">Cargando el mapa…</p>
    <noscript><p class="vista__espera">Chicha necesita JavaScript para mostrar el mapa.</p></noscript>
  </main>

  <div id="capa-ficha"></div>
  <div id="capa-modal"></div>

  <footer class="pie">
    <p><strong class="pie__marca">CHICHA</strong> · Una iniciativa de Sunqu Jach'a · Juntos, construimos el Perú</p>
    <p class="pie__menor">Íconos: Tabler Icons (MIT).</p>
  </footer>

  <script>
    (function () {
      var b = document.getElementById('btn-menu'), n = document.getElementById('nav-principal');
      if (!b || !n) return;
      b.addEventListener('click', function () {
        var abierto = n.classList.toggle('nav--abierta');
        b.setAttribute('aria-expanded', String(abierto));
      });
      n.addEventListener('click', function (e) {
        if (e.target.closest('a')) { n.classList.remove('nav--abierta'); b.setAttribute('aria-expanded', 'false'); }
      });
    })();
  </script>
  <script type="module" src="assets/js/app.js"></script>
</body>
</html>
